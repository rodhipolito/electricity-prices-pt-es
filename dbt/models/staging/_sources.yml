version: 2

sources:
  - name: entsoe
    description: "Raw day-ahead electricity prices from the ENTSO-E Transparency Platform, loaded by the Python ingestion pipeline."
    schema: public
    tables:
      - name: electricity_prices
        description: "One row per bidding zone per 15-minute delivery period. Timestamps are stored without time zone and represent UTC."
        columns:
          - name: id
            description: "Surrogate key generated by the database on insert."
          - name: bidding_zone
            description: "ENTSO-E bidding zone code (e.g. PT, ES)."
          - name: period_start
            description: "Start of the delivery period (UTC, stored without time zone)."
          - name: period_end
            description: "End of the delivery period (UTC, stored without time zone)."
          - name: price_eur_mwh
            description: "Day-ahead price in EUR/MWh."
          - name: loaded_at
            description: "Timestamp when the row was loaded by the ingestion pipeline."
